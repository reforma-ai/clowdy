name: CI
# A pull request into main that changes code runs the gate on the result of merging it into main. `ci-ok` is the one check to look at.
# Only pull requests into main, and only ones that change code (not documents), so there is nothing to re-run after the merge.
# GitHub cannot require a check on a private repository of a free plan, so a merge waits for a green `ci-ok` by convention (GITFLOW.md).

on:
    pull_request:
        branches:
            - main
        paths:
            - 'apps/**'
            - 'packages/**'
            - 'scripts/**'
            - 'package.json'
            - 'bun.lock'
            - 'bunfig.toml'
            - 'turbo.json'
            - 'tsconfig.json'
            - 'biome.json'
            - 'postcss.config.mjs'
            - '.github/workflows/ci.yml'
            - '.github/workflows/gate.yml'
            - '!**/*.md'

# A newer push to the branch makes the running gate moot.
concurrency:
    group: ci-${{ github.event.pull_request.number }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    gate:
        uses: ./.github/workflows/gate.yml

    ci-ok:
        needs: gate
        # The gate's result is the worst of its jobs: any failed or cancelled one fails this job too, and so does a skipped gate, so none is lost in a skip.
        if: always()
        runs-on: ubuntu-latest
        env:
            RESULT: ${{ needs.gate.result }}
        steps:
            - run: test "$RESULT" = success
