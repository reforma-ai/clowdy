name: Release OTA bundle
# Every push to main that may change the renderer, the daemon, or the system skills builds this commit's bundle and
# publishes it to the `ota` prerelease, unless it should not go out yet (apps/desktop/scripts/publish-ota.ts says why).
# Rules: apps/desktop/AGENTS.md (Releases).

on:
    push:
        branches:
            - main
        paths:
            - 'apps/desktop/**'
            - 'apps/daemon/**'
            - 'packages/**'
            - 'package.json'
            - 'bun.lock'
            - '.github/workflows/release-ota.yml'
    workflow_dispatch: {}

# A running publish completes before another starts. Archives stay available for clients holding an older manifest.
concurrency:
    group: release-ota
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    publish:
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        # The signing key lives in this environment, which only main (and next) may use.
        environment: desktop-release
        permissions:
            contents: write
        steps:
            # Full history and tags: the bundle version counts first-parent commits, and the shell's files are compared with its release tag.
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
              with:
                  fetch-depth: 0
            # Vite runs on the runner's Node.
            - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
              with:
                  node-version: 24
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version-file: package.json
            - run: bun install --frozen-lockfile
            - run: bun apps/desktop/scripts/publish-ota.ts
              env:
                  GH_TOKEN: ${{ github.token }}
                  CLOWDY_OTA_SIGNING_KEY: ${{ secrets.CLOWDY_OTA_SIGNING_KEY }}
                  CLOWDY_OTA_PUBLIC_KEY: ${{ vars.CLOWDY_OTA_PUBLIC_KEY }}
